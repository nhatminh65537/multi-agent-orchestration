[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coord"
version = "0.4.0"
description = "Worker Manager MCP server + Claude Code plugin for peer-group agent orchestration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  # mcp 2.x renames FastMCP -> MCPServer; the protocol doc and runbook target 1.x.
  "mcp>=1.2.0,<2",
  "httpx>=0.27.0",
  "pydantic>=2.6.0",
  # Legacy driver only. Install one of the extras below for a real backend.
  "openai>=1.50.0",
]

[project.optional-dependencies]
# Default backend: full Claude Code harness (Read/Edit/Write/Bash/Glob/Grep,
# project skills, project MCP, can_use_tool policy hook, resume + fork_session).
claude = ["claude-agent-sdk>=0.2,<0.3"]
# Peer backend: Gemini / Vertex / OpenAI-compatible through the Antigravity runtime.
agy = ["google-antigravity>=0.1.23,<0.2"]
both = ["claude-agent-sdk>=0.2,<0.3", "google-antigravity>=0.1.23,<0.2"]

[project.scripts]
coord = "coord.cli:main"

[project.urls]
Homepage = "https://notes.home.rougitsune.top/doc/multi-agent-orchestration-8QH6VOye9y"

[tool.hatch.build.targets.wheel]
packages = ["coord"]

[tool.uv]
# Pin the interpreter used for the server; the system python3 may be PyPy.
python-preference = "managed"
